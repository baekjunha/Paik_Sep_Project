
<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>VPSync Review Pad</title>

<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    touch-action: manipulation;
  }

  body {
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #111;
    color: #eee;
  }

  .wrap {
    max-width: 1000px;
    margin: 0 auto;
  }

  h1 {
    font-size: 22px;
    margin: 0 0 10px;
  }

  .sub {
    opacity: .75;
    margin-bottom: 12px;
    font-size: 14px;
  }

  canvas {
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    display: block;

    background-image: url('/ScreenShot00002.png');
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    background-color: #111;

    border-radius: 12px;
    touch-action: none;
  }

  .buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    min-height: 54px;
    border: 0;
    border-radius: 10px;
    font-size: 18px;
    font-weight: 700;
  }

  #clear {
    background: #333;
    color: #fff;
  }

  #send {
    background: #e8e8e8;
    color: #111;
  }

  #status {
    margin-top: 10px;
    min-height: 24px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
  }
</style>
</head>

<body>

<div class="wrap">

  <h1>VPSync Review Pad</h1>

  <div class="sub">
    Apple Pencil / 손가락으로 그린 뒤 SEND
  </div>

  <canvas id="pad"></canvas>

  <div class="buttons">
    <button id="clear">CLEAR</button>
    <button id="send">SEND</button>
  </div>

  <div id="status">Ready</div>

</div>

<script>

const PRESET = "RC_VPSyncOperator";
const FUNCTION_DISPLAY_NAME = "Receive Review Drawing";

const ENDPOINT = "/vpsync/review-drawing";

const canvas = document.getElementById("pad");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");

let strokes = [];
let currentStroke = null;
let drawing = false;
let lastPixelPoint = null;


// ======================================================
// [08-128] 이미지 모드 관리
//
// LIVE    : Unreal F6 캡처 자동 갱신
// ARCHIVE : 저장된 Review 이미지 표시용
//
// 현재는 LIVE만 사용.
// ARCHIVE 진입과 이미지 조회는 다음 단계에서 구현.
// ======================================================

let imageMode = "LIVE";


// ======================================================
// Canvas 크기 설정
// ======================================================

function resizeCanvas() {

  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#111";

  redraw();
}


// ======================================================
// 저장된 Stroke 다시 그리기
// ======================================================

function redraw() {

  const rect = canvas.getBoundingClientRect();

  ctx.clearRect(0, 0, rect.width, rect.height);

  for (const stroke of strokes) {

    if (stroke.length < 2) continue;

    ctx.beginPath();

    ctx.moveTo(
      stroke[0].x * rect.width,
      stroke[0].y * rect.height
    );

    for (let i = 1; i < stroke.length; i++) {

      ctx.lineTo(
        stroke[i].x * rect.width,
        stroke[i].y * rect.height
      );

    }

    ctx.stroke();
  }
}


// ======================================================
// Pointer 좌표 정규화
// ======================================================

function pointFromEvent(e) {

  const rect = canvas.getBoundingClientRect();

  const px = e.clientX - rect.left;
  const py = e.clientY - rect.top;

  return {
    px,
    py,

    x: Math.max(
      0,
      Math.min(1, px / rect.width)
    ),

    y: Math.max(
      0,
      Math.min(1, py / rect.height)
    )
  };
}


// ======================================================
// 최소 Stroke 이동 거리 검사
// ======================================================

function farEnough(a, b) {

  if (!a || !b) return true;

  const dx = a.px - b.px;
  const dy = a.py - b.py;

  // 약 3px 이상 이동했을 때만 저장
  return (dx * dx + dy * dy) >= 9;
}


// ======================================================
// Apple Pencil 시작
// ======================================================

canvas.addEventListener("pointerdown", e => {

  if (e.pointerType !== "pen") return;

  e.preventDefault();

  canvas.setPointerCapture(e.pointerId);

  drawing = true;

  currentStroke = [];

  strokes.push(currentStroke);

  const p = pointFromEvent(e);

  currentStroke.push({
    x: p.x,
    y: p.y
  });

  lastPixelPoint = p;

  ctx.beginPath();
  ctx.moveTo(p.px, p.py);
});


// ======================================================
// Apple Pencil 이동
// ======================================================

canvas.addEventListener("pointermove", e => {

  if (e.pointerType !== "pen") return;

  if (!drawing || !currentStroke) return;

  e.preventDefault();

  const p = pointFromEvent(e);

  if (!farEnough(p, lastPixelPoint)) return;

  currentStroke.push({
    x: p.x,
    y: p.y
  });

  ctx.lineTo(p.px, p.py);
  ctx.stroke();

  lastPixelPoint = p;
});


// ======================================================
// Apple Pencil 종료
// ======================================================

function endStroke(e) {

  if (e.pointerType !== "pen") return;

  if (!drawing) return;

  e.preventDefault();

  drawing = false;
  currentStroke = null;
  lastPixelPoint = null;
}

canvas.addEventListener("pointerup", endStroke);
canvas.addEventListener("pointercancel", endStroke);


// ======================================================
// CLEAR
// ======================================================

document.getElementById("clear").addEventListener(
  "click",
  () => {

    strokes = [];

    redraw();

    statusEl.textContent = "Cleared";
  }
);


// ======================================================
// Stroke 직렬화
//
// Stroke 구분 : |
// Point 구분  : ;
// 좌표        : 0~1 정규화
// ======================================================

function serializeStrokes() {

  return strokes
    .filter(s => s.length > 0)
    .map(stroke =>
      stroke.map(p =>
        `${p.x.toFixed(4)},${p.y.toFixed(4)}`
      ).join(";")
    )
    .join("|");
}


// ======================================================
// SEND
// ======================================================

document.getElementById("send").addEventListener(
  "click",
  async () => {

    const drawingData = serializeStrokes();

    if (!drawingData) {

      statusEl.textContent = "그림이 없습니다.";

      return;
    }

    statusEl.textContent =
      `Sending ${drawingData.length} chars...`;

    try {

      const res = await fetch(ENDPOINT, {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          DrawingData: drawingData
        })
      });

      const text = await res.text();

      if (!res.ok) {

        throw new Error(
          `HTTP ${res.status}: ${text}`
        );
      }

      statusEl.textContent =
        `PASS | strokes=${strokes.length} | chars=${drawingData.length}`;

    } catch (err) {

      console.error(err);

      statusEl.textContent =
        `FAIL | ${err.message}`;
    }
  }
);


// ======================================================
// Canvas 초기화 및 Resize
// ======================================================

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


// ======================================================
// F6 Screenshot 자동 갱신
//
// 1.5초마다 HEAD 요청
// ETag / Last-Modified 비교
//
// LIVE 모드에서만 갱신
// ARCHIVE 모드에서는 갱신하지 않음
// ======================================================

let lastCaptureVersion = null;

setInterval(async () => {

  // [08-128] 추가
  // 저장된 Review를 보고 있을 때
  // LIVE 이미지가 덮어쓰는 것을 방지
  if (imageMode !== "LIVE") {
    return;
  }

  try {

    const response = await fetch(
      "/ScreenShot00002.png",
      {
        method: "HEAD",
        cache: "no-store"
      }
    );

    if (!response.ok) return;

    const version =
      response.headers.get("etag") ||
      response.headers.get("last-modified");

    if (!version || version === lastCaptureVersion) {
      return;
    }

    // 기존 필기 보호 로직 유지
    if (drawing || strokes.length > 0) {
      return;
    }

    lastCaptureVersion = version;

    canvas.style.backgroundImage =
      `url("/ScreenShot00002.png?v=${encodeURIComponent(version)}")`;

  } catch (error) {

    console.error(
      "Screenshot refresh failed:",
      error
    );

  }

}, 1500);

</script>

</body>
</html>
