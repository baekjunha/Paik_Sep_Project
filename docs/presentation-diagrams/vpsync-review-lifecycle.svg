<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#13213a"/></linearGradient><filter id="s2"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-opacity=".3"/></filter><marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#7dd3fc"/></marker><style>.ti{font:700 40px 'Segoe UI','Malgun Gothic';fill:#f8fafc}.su{font:400 20px 'Segoe UI','Malgun Gothic';fill:#94a3b8}.node{fill:#17263c;stroke:#38bdf8;stroke-width:2}.store{fill:#17362f;stroke:#34d399;stroke-width:2}.warn{fill:#3a2b15;stroke:#fbbf24;stroke-width:2}.h{font:700 24px 'Segoe UI','Malgun Gothic';fill:#f8fafc}.t{font:500 18px 'Segoe UI','Malgun Gothic';fill:#e2e8f0}.sm{font:400 16px 'Segoe UI','Malgun Gothic';fill:#cbd5e1}.ln{fill:none;stroke:#7dd3fc;stroke-width:4;marker-end:url(#a2)}.n{font:700 18px Consolas;fill:#7dd3fc}.eq{font:700 30px Consolas;fill:#f8fafc}</style></defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg2)"/><text x="70" y="72" class="ti">Review 생명주기 · 저장에서 장면 복원까지</text><text x="70" y="108" class="su">Review는 이미지가 아니라 Shot identity, 상대 시간, 필기, PNG를 묶은 재현 가능한 컨텍스트다.</text>
  <rect x="65" y="190" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="95" y="235" class="n">01 LIVE</text><text x="95" y="274" class="h">장면 조작</text><text x="95" y="306" class="sm">Shot 선택 · RC · 재생</text>
  <rect x="330" y="190" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="360" y="235" class="n">02 CAPTURE</text><text x="360" y="274" class="h">맥락 고정</text><text x="360" y="306" class="sm">ShotName · 상대 Frame · PNG</text>
  <rect x="595" y="190" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="625" y="235" class="n">03 ANNOTATE</text><text x="625" y="274" class="h">필기 결합</text><text x="625" y="306" class="sm">DrawingData JSON</text>
  <rect x="860" y="190" width="215" height="150" rx="22" class="store" filter="url(#s2)"/><text x="890" y="235" class="n">04 SAVE</text><text x="890" y="274" class="h">영속 저장</text><text x="890" y="306" class="sm">DB 레코드 + review_{id}.png</text>
  <rect x="1125" y="190" width="215" height="150" rx="22" class="store" filter="url(#s2)"/><text x="1155" y="235" class="n">05 ARCHIVE</text><text x="1155" y="274" class="h">동일 Review 조회</text><text x="1155" y="306" class="sm">PC · iPad 공통 Review ID</text>
  <path d="M280 265H330" class="ln"/><path d="M545 265H595" class="ln"/><path d="M810 265H860" class="ln"/><path d="M1075 265H1125" class="ln"/>

  <rect x="1125" y="455" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="1155" y="500" class="n">06 RESTORE</text><text x="1155" y="539" class="h">장면 Seek</text><text x="1155" y="571" class="sm">Shot 검색 · Master Frame 계산</text>
  <rect x="860" y="455" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="890" y="500" class="n">07 REPLAY</text><text x="890" y="539" class="h">시각 자료 복원</text><text x="890" y="571" class="sm">Drawing · PNG · ARCHIVE 표시</text>
  <rect x="595" y="455" width="215" height="150" rx="22" class="node" filter="url(#s2)"/><text x="625" y="500" class="n">08 RETURN</text><text x="625" y="539" class="h">LIVE 복귀</text><text x="625" y="571" class="sm">ReturnToLive 명시 호출</text>
  <path d="M1232 340V455" class="ln"/><path d="M1125 530H1075" class="ln"/><path d="M860 530H810" class="ln"/><path d="M595 530 C360 530 195 460 172 340" class="ln"/>

  <rect x="70" y="690" width="920" height="145" rx="22" fill="#17263c" stroke="#64748b" stroke-width="2"/><text x="105" y="733" class="h">시간 좌표 변환</text><text x="105" y="783" class="eq">MasterFrame = ShotStartFrame + SavedRelativeFrame</text><text x="105" y="816" class="t">실측 설명 예: 870 + 80 = 950 · Shot 배치가 바뀌어도 같은 Shot 내부 위치를 찾기 위한 모델</text>
  <rect x="1040" y="690" width="490" height="145" rx="22" class="warn"/><text x="1075" y="733" class="h">복원 실패 조건도 발표에 포함</text><text x="1075" y="774" class="t">Shot 삭제·이름 변경 · API/DB 실패 · PNG 누락</text><text x="1075" y="810" class="sm">현재는 Sequence 버전 마이그레이션 규칙까지는 구현하지 않음</text>
</svg>
