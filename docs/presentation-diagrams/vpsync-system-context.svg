<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#101f35"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#7dd3fc"/></marker>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#a7f3d0"/></marker>
    <style>
      .title{font:700 40px 'Segoe UI','Malgun Gothic',sans-serif;fill:#f8fafc}.sub{font:400 20px 'Segoe UI','Malgun Gothic',sans-serif;fill:#94a3b8}.zone{fill:#0f1d31;stroke:#334155;stroke-width:2}.box{fill:#17263c;stroke:#475569;stroke-width:2}.blue{fill:#102e46;stroke:#38bdf8}.green{fill:#12372f;stroke:#34d399}.amber{fill:#3a2b15;stroke:#fbbf24}.purple{fill:#2c2042;stroke:#a78bfa}.h{font:700 26px 'Segoe UI','Malgun Gothic',sans-serif;fill:#f8fafc}.t{font:500 20px 'Segoe UI','Malgun Gothic',sans-serif;fill:#e2e8f0}.sm{font:400 17px 'Segoe UI','Malgun Gothic',sans-serif;fill:#cbd5e1}.cap{font:700 18px 'Segoe UI','Malgun Gothic',sans-serif;fill:#7dd3fc}.line{fill:none;stroke:#7dd3fc;stroke-width:4;marker-end:url(#arrow)}.line2{fill:none;stroke:#a7f3d0;stroke-width:4;marker-end:url(#arrow2)}.dash{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:10 9}.port{font:700 17px Consolas,monospace;fill:#fbbf24}
    </style>
  </defs>
  <rect width="1600" height="900" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" class="title">VPSync 시스템 컨텍스트 · 실행 배치</text>
  <text x="70" y="108" class="sub">조작 경로와 리뷰 저장 경로를 분리해 보면, 프로젝트의 실제 경계와 외부 의존성이 드러난다.</text>

  <rect x="55" y="145" width="300" height="610" rx="24" class="zone"/><text x="80" y="188" class="h">클라이언트 장치</text>
  <rect x="85" y="230" width="240" height="150" rx="18" class="box" filter="url(#shadow)"/><text x="115" y="278" class="h">iPad Browser</text><text x="115" y="315" class="t">Shot · Camera RC</text><text x="115" y="347" class="t">Drawing · Review LOAD</text>
  <rect x="85" y="430" width="240" height="150" rx="18" class="box" filter="url(#shadow)"/><text x="115" y="478" class="h">PC Browser</text><text x="115" y="515" class="t">Operator UI</text><text x="115" y="547" class="t">LIVE / ARCHIVE 확인</text>
  <text x="85" y="704" class="sm">같은 LAN의 브라우저가</text><text x="85" y="731" class="sm">제어·검토 UI에 접속</text>

  <rect x="405" y="145" width="340" height="610" rx="24" class="zone"/><text x="430" y="188" class="h">웹 게이트웨이</text>
  <rect x="440" y="235" width="270" height="170" rx="18" class="blue" filter="url(#shadow)"/><text x="470" y="282" class="h">UE WebApp</text><text x="470" y="318" class="t">App.ts / App.js</text><text x="470" y="350" class="t">Remote Control UI</text><text x="470" y="382" class="port">:30000</text>
  <rect x="440" y="475" width="270" height="160" rx="18" class="green" filter="url(#shadow)"/><text x="470" y="522" class="h">Review API</text><text x="470" y="558" class="t">ASP.NET Core · .NET 8</text><text x="470" y="594" class="port">:5000</text>
  <text x="440" y="704" class="sm">WebApp은 Engine 설치 폴더,</text><text x="440" y="731" class="sm">Review API는 별도 실행물</text>

  <rect x="795" y="145" width="390" height="610" rx="24" class="zone"/><text x="820" y="188" class="h">Unreal Engine 5.7</text>
  <rect x="830" y="230" width="320" height="145" rx="18" class="blue" filter="url(#shadow)"/><text x="860" y="273" class="h">Remote Control</text><text x="860" y="309" class="t">HTTP <tspan class="port">:30010</tspan> · WS <tspan class="port">:30020</tspan></text><text x="860" y="342" class="sm">Function 호출 · 상태 질의/전파</text>
  <rect x="830" y="415" width="320" height="145" rx="18" class="purple" filter="url(#shadow)"/><text x="860" y="458" class="h">BP_VPSessionController</text><text x="860" y="494" class="t">MasterSequencePlayer</text><text x="860" y="527" class="sm">Shot 탐색 · Seek · Active Camera RC</text>
  <rect x="830" y="600" width="320" height="105" rx="18" class="green" filter="url(#shadow)"/><text x="860" y="641" class="h">UReviewSubsystem</text><text x="860" y="676" class="sm">Review POST/GET · 상태 이벤트</text>

  <rect x="1235" y="145" width="310" height="610" rx="24" class="zone"/><text x="1260" y="188" class="h">영속 데이터</text>
  <rect x="1270" y="260" width="240" height="145" rx="18" class="amber" filter="url(#shadow)"/><text x="1300" y="305" class="h">LocalDB</text><text x="1300" y="341" class="t">VPSyncReviewDb</text><text x="1300" y="374" class="sm">Shot · Frame · Drawing · Path</text>
  <rect x="1270" y="470" width="240" height="145" rx="18" class="amber" filter="url(#shadow)"/><text x="1300" y="515" class="h">ReviewImages</text><text x="1300" y="551" class="t">review_{id}.png</text><text x="1300" y="584" class="sm">리뷰별 불변 캡처 보존</text>
  <text x="1270" y="704" class="sm">Git 저장소 밖 데이터:</text><text x="1270" y="731" class="sm">DB 행 · PNG · Engine WebApp</text>

  <path d="M325 305 C370 305 390 300 440 300" class="line"/><text x="352" y="282" class="cap">UI</text>
  <path d="M710 315 C760 315 780 300 830 300" class="line"/><text x="741" y="281" class="cap">제어/질의</text>
  <path d="M710 555 C760 555 790 650 830 650" class="line2"/><text x="735" y="608" class="sm">Review API</text>
  <path d="M1150 650 C1215 650 1210 330 1270 330" class="line2"/><path d="M1150 650 C1215 650 1210 545 1270 545" class="line2"/>
  <path d="M325 505 C375 505 395 555 440 555" class="line2"/>

  <rect x="55" y="790" width="1490" height="70" rx="18" fill="#3a201a" stroke="#fb7185" stroke-width="2"/>
  <text x="85" y="832" class="t">보안 경계: Unreal Remote Control은 인증·공개 인터넷용 서비스가 아니다. 발표에서는 “동일 LAN/VPN 내부 프로토타입”으로 한정한다.</text>
</svg>
